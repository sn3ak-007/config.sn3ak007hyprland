[main]
font=monospace:size=10
use-bold=yes
dpi-aware=auto
prompt="run:"
placeholder="Search applications..."
message="APPLICATIONS"
match-mode=fzf
fields=name,generic,keywords,comment,filename
icons-enabled=yes
icon-theme=Adwaita
width=42
lines=8
horizontal-pad=12
vertical-pad=8
inner-pad=6
line-height=24
tabs=4
anchor=center
layer=overlay

[border]
width=1
radius=0
selection-radius=0

[colors]
background=0d0d0df5
text=e6e6e6ff
message=a0a0a0ff
prompt=bdbdbdff
placeholder=777777ff
input=f2f2f2ff
match=ffffffff
selection=e5e5e5ff
selection-text=101010ff
selection-match=101010ff
counter=999999ff
border=666666ff
