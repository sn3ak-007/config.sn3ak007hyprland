general {
    hide_cursor = true
    ignore_empty_input = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 5
    brightness = 0.55
    contrast = 0.9
}

input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgba(e6e6e6ff)
    inner_color = rgba(111111ee)
    font_color = rgba(f0f0f0ff)

    fade_on_empty = false
    placeholder_text = <i>Enter password...</i>

    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date '+%H:%M'
    color = rgba(f0f0f0ff)

    font_size = 64
    font_family = Liberation Mono

    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(bdbdbdff)

    font_size = 16
    font_family = Liberation Mono

    position = 0, 15
    halign = center
    valign = center
}
